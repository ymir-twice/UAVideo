<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/videobuddy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoBuddy - 视频理解智能体</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #app {
        height: 100%;
        font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        background-color: #1a1614;
        color: #fef3c7;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1614;
      }
      ::-webkit-scrollbar-thumb {
        background: #44403c;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #57534e;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
